<svg width="800" height="600" viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8ab4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#81c995;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="#1e1e1e" fill-opacity="0" />

  <!-- Group everything and center it better with a slight scale up in logic (by reducing viewBox) -->
  <g transform="translate(-50, -20)">
      <!-- Nodes -->
      <!-- User Input -->
      <g transform="translate(100, 220)">
        <circle cx="60" cy="60" r="50" fill="none" stroke="#8ab4f8" stroke-width="3" />
        <text x="60" y="65" font-family="Arial" font-size="16" font-weight="bold" fill="#e8eaed" text-anchor="middle">User Task</text>
      </g>

      <!-- Arrow 1 -->
      <line x1="220" y1="280" x2="290" y2="280" stroke="#5f6368" stroke-width="3" marker-end="url(#arrowhead)" />

      <!-- Planning Node -->
      <g transform="translate(300, 220)">
        <rect x="0" y="0" width="140" height="120" rx="15" fill="rgba(138, 180, 248, 0.1)" stroke="#8ab4f8" stroke-width="3" />
        <text x="70" y="55" font-family="Arial" font-size="20" font-weight="bold" fill="#8ab4f8" text-anchor="middle">Planning</text>
        <text x="70" y="85" font-family="Arial" font-size="14" fill="#9aa0a6" text-anchor="middle">Decompose</text>
      </g>

      <!-- Arrow 2 -->
      <line x1="440" y1="280" x2="510" y2="280" stroke="#5f6368" stroke-width="3" />

      <!-- Tools Node -->
      <g transform="translate(520, 160)">
        <rect x="0" y="0" width="140" height="240" rx="15" fill="rgba(129, 201, 149, 0.1)" stroke="#81c995" stroke-width="3" />
        <text x="70" y="40" font-family="Arial" font-size="20" font-weight="bold" fill="#81c995" text-anchor="middle">Tool Use</text>
        
        <!-- Tool Items -->
        <rect x="25" y="60" width="90" height="40" rx="6" fill="none" stroke="#81c995" stroke-width="1.5" />
        <text x="70" y="85" font-family="Arial" font-size="14" fill="#e8eaed" text-anchor="middle">Search</text>
        
        <rect x="25" y="110" width="90" height="40" rx="6" fill="none" stroke="#81c995" stroke-width="1.5" />
        <text x="70" y="135" font-family="Arial" font-size="14" fill="#e8eaed" text-anchor="middle">Code</text>
        
        <rect x="25" y="160" width="90" height="40" rx="6" fill="none" stroke="#81c995" stroke-width="1.5" />
        <text x="70" y="185" font-family="Arial" font-size="14" fill="#e8eaed" text-anchor="middle">API</text>
      </g>

      <!-- Loop back arrow -->
      <path d="M 590 400 Q 590 480 370 480 Q 370 480 370 350" fill="none" stroke="#5f6368" stroke-width="3" stroke-dasharray="8,8" />
      <text x="480" y="500" font-family="Arial" font-size="14" fill="#5f6368" text-anchor="middle">Iterative Feedback</text>
  </g>
</svg>