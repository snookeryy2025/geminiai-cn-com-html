<svg width="800" height="600" viewBox="0 0 820 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background for sizing context (transparent) -->
  <rect width="600" height="450" fill="none" />

  <g transform="translate(-20, -20) scale(1.1)">
      <!-- Inputs -->
      <g transform="translate(60, 80)">
        <!-- Text -->
        <rect x="0" y="0" width="80" height="60" rx="10" fill="rgba(138, 180, 248, 0.1)" stroke="#8ab4f8" stroke-width="3" />
        <text x="40" y="35" font-family="Arial" font-size="16" font-weight="bold" fill="#8ab4f8" text-anchor="middle">Text</text>
        
        <!-- Image -->
        <rect x="0" y="90" width="80" height="60" rx="10" fill="rgba(242, 139, 130, 0.1)" stroke="#f28b82" stroke-width="3" />
        <text x="40" y="125" font-family="Arial" font-size="16" font-weight="bold" fill="#f28b82" text-anchor="middle">Image</text>

        <!-- Audio -->
        <rect x="0" y="180" width="80" height="60" rx="10" fill="rgba(253, 214, 99, 0.1)" stroke="#fdd663" stroke-width="3" />
        <text x="40" y="215" font-family="Arial" font-size="16" font-weight="bold" fill="#fdd663" text-anchor="middle">Audio</text>

        <!-- Video -->
        <rect x="0" y="270" width="80" height="60" rx="10" fill="rgba(129, 201, 149, 0.1)" stroke="#81c995" stroke-width="3" />
        <text x="40" y="305" font-family="Arial" font-size="16" font-weight="bold" fill="#81c995" text-anchor="middle">Video</text>
      </g>

      <!-- Central Model -->
      <g transform="translate(320, 150)">
        <circle cx="100" cy="100" r="90" fill="url(#grad1)" stroke="white" stroke-width="3" stroke-opacity="0.3">
        </circle>
        <text x="100" y="90" font-family="Arial" font-size="28" font-weight="bold" fill="white" text-anchor="middle">Gemini</text>
        <text x="100" y="125" font-family="Arial" font-size="22" font-weight="bold" fill="white" text-anchor="middle">3.8 Flash</text>
        
        <!-- Native Multimodal Label -->
        <text x="100" y="230" font-family="Arial" font-size="16" fill="#e8eaed" text-anchor="middle" opacity="0.9">Native Multimodal</text>
      </g>
      
      <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#4285f4;stop-opacity:0.9" />
          <stop offset="100%" style="stop-color:#34a853;stop-opacity:0.9" />
      </linearGradient>

      <!-- Connecting Lines -->
      <path d="M 150 110 L 330 200" stroke="#8ab4f8" stroke-width="3" opacity="0.6" />
      <path d="M 150 200 L 330 220" stroke="#f28b82" stroke-width="3" opacity="0.6" />
      <path d="M 150 290 L 330 240" stroke="#fdd663" stroke-width="3" opacity="0.6" />
      <path d="M 150 380 L 330 260" stroke="#81c995" stroke-width="3" opacity="0.6" />

      <!-- Output -->
      <g transform="translate(560, 210)">
        <path d="M 0 0 L 25 12 L 0 25 Z" fill="#e8eaed" />
        <text x="50" y="18" font-family="Arial" font-size="18" font-weight="bold" fill="#e8eaed">Text Output</text>
      </g>
      
      <line x1="430" y1="250" x2="550" y2="222" stroke="white" stroke-width="3" stroke-dasharray="6" opacity="0.6" />
  </g>

</svg>